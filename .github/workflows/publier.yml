# Publie le site à chaque poussée sur main : construit l'image par le Dockerfile,
# avec GIT_SHA au commit, et la pousse sur ghcr.io/<compte>/<dépôt>, étiquetée
# `main` et par le commit. Le serveur qui sert le site tire l'étiquette `main`
# toutes les cinq minutes.
name: Publier

on:
  push:
    branches: [main]

permissions:
  contents: read

# Les poussées passent l'une après l'autre ; aucune n'est annulée en cours.
concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: image
        name: Nommer l'image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Se connecter au registre
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$JETON" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Construire l'image
        env:
          IMAGE: ${{ steps.image.outputs.nom }}
        run: |
          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:main" \
            .

      - name: Pousser l'image
        env:
          IMAGE: ${{ steps.image.outputs.nom }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          echo "Image : \`$IMAGE:main\` (\`$IMAGE:$GITHUB_SHA\`)" >>"$GITHUB_STEP_SUMMARY"
